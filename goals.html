<section class="page-hero compact"><span class="eyebrow">GOALS</span><h1>목표</h1><p>돈을 모으는 이유를 숫자와 날짜로 바꾸고, 현재 속도와 필요한 속도를 비교합니다.</p></section>
<section class="page-wrap">
  <div class="goal-page-toolbar"><div><h2>내 목표</h2><p>목표금액과 월 적립액을 기준으로 필요한 시간을 계산합니다.</p></div><button id="openGoalForm" class="btn primary" type="button">＋ 새 목표 추가</button></div>

    <div class="card-title"><div><small>NEW GOAL</small><h3>새 목표 추가</h3></div><button id="closeGoalForm" class="text-toggle" type="button">닫기 ×</button></div>
    <div class="goal-choice mini" id="newGoalChoice"><button type="button" class="active" data-goal="1억 만들기">💰 1억 만들기</button><button type="button" data-goal="내 집 마련">🏠 내 집 마련</button><button type="button" data-goal="자동차">🚗 자동차</button><button type="button" data-goal="여행">✈️ 여행</button><button type="button" data-goal="직접 입력">＋ 직접 입력</button></div>
    <div class="goal-choice-summary" id="newGoalSummary"></div>
    <div class="field-row"><label>목표 이름<div class="simple-field"><input id="newGoalName" value="1억 만들기"></div></label><label>목표금액<div class="currency-field"><input id="newGoalTarget" class="comma-input" inputmode="numeric" value="100,000,000"><span>원</span></div></label></div>
    <div class="field-row"><label>현재 모은 금액<div class="currency-field"><input id="newGoalCurrent" class="comma-input" inputmode="numeric" value="0"><span>원</span></div></label><label>매달 이 목표에 넣을 금액<div class="currency-field"><input id="newGoalMonthly" class="comma-input" inputmode="numeric" value="500,000"><span>원</span></div></label></div>
    <button id="saveNewGoal" class="btn primary full" type="button">목표 저장하기</button>
  </div>
